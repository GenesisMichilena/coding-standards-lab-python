name: Pylint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pylint
        run: python -m pip install pylint

      - name: Run Pylint
        run: python -m pylint test.py
